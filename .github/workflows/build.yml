name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: potlock-source/**/*.gradle*

      - name: Build mod
        working-directory: potlock-source
        run: ./gradlew --no-daemon clean build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: potlock-${{ github.ref_name }}
          path: potlock-source/build/libs/potlock-*.jar
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Pot Slot Lock ${{ github.ref_name }}
          body: |
            Pot Slot Lock para Fabric 1.20.1 y Farmer's Delight.
            Autor: leaenojqdo (https://github.com/leaenojqdo).

            Bloquea cada slot de ingredientes al item que tenia cuando se activo. Los slots vacios quedan bloqueados para la automatizacion; se puede seguir editando la olla manualmente y desbloquearla para restaurar el comportamiento normal.

            Cambios de esta version:
            - El boton de bloqueo ahora esta centrado debajo del inventario del jugador.
            - Los metadatos identifican a leaenojqdo como autor.
            - El proyecto compila y publica el JAR mediante GitHub Actions.

            Requiere Fabric y Farmer's Delight para Minecraft 1.20.1.
          files: potlock-source/build/libs/potlock-*.jar
          fail_on_unmatched_files: true
